<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบคำร้องขอสอบซ่อมส่งถึงพี่เหนือ 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6eb;
            font-family: 'Kanit', sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.2);
            position: relative;
            max-width: 90%;
            width: 400px;
        }
        h1 { 
            color: #ff4d6d; 
            margin-bottom: 10px;
        }
        p { 
            color: #555; 
            font-size: 1.1rem; 
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
            flex-wrap: wrap; /* เผื่อหน้าจอมือถือเล็ก ปุ่มจะได้ปัดตกลงมาสวยๆ */
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Kanit', sans-serif;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-next {
            background-color: #ffb3c1;
            color: #d90429;
            width: 100%;
            max-width: 200px;
        }
        .btn-next:hover {
            background-color: #ff8fa3;
        }
        #btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: relative;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: -10px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container fade-in" id="content">
        <div class="emoji">😔</div>
        <h1>ผมผิดเองครับ 🥹</h1>
        <p>ที่เผลอเรียกพี่เหนือว่า "หมู" 😭<br>จริง ๆ ไม่ได้ตั้งใจจะเรียกแบบนั้นเลยครับ<br>ปากมันไปก่อนสมอง 555<br>แต่พอคิดย้อนกลับมาแล้ว... ผมผิดเองครับ</p>
        <div class="btn-group">
            <button class="btn-next" onclick="nextStep(1)">กดเพื่ออ่านต่อ ➔</button>
        </div>
    </div>

    <script>
        // 🛑 เอา URL ของ Web App จาก Google App Script มาใส่ตรงนี้ 👇
        const scriptURL = 'ใส่_URL_ที่ก๊อปมา_ตรงนี้';

        function nextStep(step) {
            const content = document.getElementById('content');
            
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');

            if (step === 1) {
                content.innerHTML = `
                    <div class="emoji">💔</div>
                    <h1>"สอบตกละ"</h1>
                    <p>พอพี่เหนือพิมพ์คำนี้มา เล่นเอาผมหน้าเสียเลย<br>คะแนนความประพฤติติดลบไปแล้วใช่มั้ยครับ 😭<br>หรือว่างานนี้... ต้องสอบซ่อมแล้วครับ</p>
                    <div class="btn-group">
                        <button class="btn-next" onclick="nextStep(2)">แต่เดี๋ยวก่อน... ➔</button>
                    </div>
                `;
            } else if (step === 2) {
                content.innerHTML = `
                    <div class="emoji">🍵🍫</div>
                    <h1>ขอโอกาสสอบซ่อมได้มั้ยครับ? 🥺</h1>
                    <p>ให้ผมได้แก้ตัวนะ เดี๋ยวชาเขียวกับช็อกโกแลตของโปรด<br>ผมเอาไปส่งเป็นค่าปรับเลยครับ 555</p>
                    <div class="btn-group">
                        <button class="btn-next" onclick="nextStep(3)">สรุปก็คือ... ➔</button>
                    </div>
                `;
            } else if (step === 3) {
                content.innerHTML = `
                    <div class="emoji">🥺</div>
                    <h1>คำถามสุดท้าย...</h1>
                    <p>ผมยังมี <b>"สิทธิ์จีบพี่เหนือต่อ"</b> มั้ยครับ? 🥺</p>
                    <div class="btn-group">
                        <button id="btn-yes" onclick="forgive()">มีสิทธิ์อยู่ 😌</button>
                        <button id="btn-no" onmouseover="moveButton(event)" ontouchstart="moveButton(event)" onclick="return false;">ยังไม่แน่ใจ ขอคิดคะแนนก่อน 😂</button>
                    </div>
                `;
            }
        }

        function moveButton(e) {
            if(e) e.preventDefault();
            const btn = document.getElementById('btn-no');
            const maxX = window.innerWidth - btn.clientWidth - 20;
            const maxY = window.innerHeight - btn.clientHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function forgive() {
            const content = document.getElementById('content');
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');
            
            content.innerHTML = `
                <div class="emoji">⏳</div>
                <h1>กำลังส่งผลสอบ...</h1>
                <p>รอแป๊บนึงนะครับ กำลังประมวลผลคะแนนสอบซ่อม</p>
            `;

            fetch(scriptURL, { method: 'POST', mode: 'no-cors' })
                .then(response => {
                    content.innerHTML = `
                        <div class="emoji">🎉🍵</div>
                        <h1>เย้! ขอบคุณครับพี่เหนือ</h1>
                        <p>สถานะ: <b>สอบผ่าน (แบบหวุดหวิด) 😂</b><br>เดี๋ยวผมเอาชาเขียวกับช็อกโกแลตไปส่งเป็นค่าปรับนะครับ<br>คราวหน้าผมจะคิดก่อนพูดแล้วครับ 🥹❤️</p>
                    `;
                })
                .catch(error => {
                    content.innerHTML = `
                        <div class="emoji">😅</div>
                        <h1>เย้! ขอบคุณครับพี่เหนือ</h1>
                        <p>สถานะ: <b>สอบผ่าน (แบบหวุดหวิด) 😂</b><br>เดี๋ยวผมเอาชาเขียวกับช็อกโกแลตไปส่งเป็นค่าปรับนะครับ<br>คราวหน้าผมจะคิดก่อนพูดแล้วครับ 🥹❤️</p>
                    `;
                });
        }
    </script>
</body>
</html>
