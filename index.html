<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบคำร้องขอสอบซ่อมส่งถึงพี่เหนือ 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6eb;
            font-family: 'Kanit', sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.2);
            position: relative;
            max-width: 90%;
            width: 400px;
        }
        h1 { 
            color: #ff4d6d; 
            margin-bottom: 10px;
        }
        p { 
            color: #555; 
            font-size: 1.1rem; 
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Kanit', sans-serif;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #btn-yes, .btn-next {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: relative;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: -10px;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="emoji">😔</div>
        <h1>ยอมรับผิดครับ...</h1>
        <p>ที่เผลอพิมพ์ไปเรียกพี่เหนือว่า "หมู"<br>ไม่ได้ตั้งใจจะบูลลี่เลย  ก็พี่น่ารักนี่น่าเลยคิดว่าพี่เป็นยังไงก็น่ารักไปหมดอะ..</p>
        <div class="btn-group">
            <button class="btn-next" onclick="nextStep(1)">กดเพื่ออ่านต่อ ➔</button>
        </div>
    </div>

    <script>
        // 🛑 เอา URL ของ Web App จาก Google App Script มาใส่ตรงนี้ 👇
        const scriptURL = 'https://script.google.com/macros/s/AKfycby-dIjMs_BvfboZTggcZdFsl7fpOjAjpQtfX85baMfU_nFHewugENARQKDLeGY_DsSp/exec';

        function nextStep(step) {
            const content = document.getElementById('content');

            if (step === 1) {
                content.innerHTML = `
                    <div class="emoji">💔</div>
                    <h1>"สอบตกละ"</h1>
                    <p>พอพี่เหนือพิมพ์คำนี้มา เล่นเอาผมหน้าเสียเลย<br>คะแนนความประพฤติติดลบไปแล้วใช่มั้ยครับ 😭</p>
                    <div class="btn-group">
                        <button class="btn-next" onclick="nextStep(2)">แต่เดี๋ยวก่อน... ➔</button>
                    </div>
                `;
            } else if (step === 2) {
                content.innerHTML = `
                    <div class="emoji">🍵🍫</div>
                    <h1>ขอโอกาสสอบซ่อมได้มั้ย?</h1>
                    <p>ให้ผมได้แก้ตัวนะ เดี๋ยวผมซื้อ<b>ชาเขียวกับช็อกโกแลต</b><br>ของโปรดไปฝากเป็นการไถ่โทษเลย!</p>
                    <div class="btn-group">
                        <button class="btn-next" onclick="nextStep(3)">สรุปก็คือ... ➔</button>
                    </div>
                `;
            } else if (step === 3) {
                content.innerHTML = `
                    <div class="emoji">🥺</div>
                    <h1>คำถามสุดท้าย...</h1>
                    <p>ผมยังมี <b>"สิทธิ์จีบพี่เหนือต่อ"</b> มั้ยครับ?</p>
                    <div class="btn-group">
                        <button id="btn-yes" onclick="forgive()">มีสิทธิ์</button>
                        <button id="btn-no" onmouseover="moveButton()" onclick="moveButton()">ไม่ให้จีบแล้ว!</button>
                    </div>
                `;
            }
        }

        function moveButton() {
            const btn = document.getElementById('btn-no');
            const maxX = window.innerWidth - btn.clientWidth - 20;
            const maxY = window.innerHeight - btn.clientHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function forgive() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="emoji">⏳</div>
                <h1>กำลังส่งผลสอบ...</h1>
                <p>รอแป๊บนึงนะครับ กำลังบันทึกความใจดีของพี่เหนือเข้า Database</p>
            `;

            fetch(scriptURL, { method: 'POST', mode: 'no-cors' })
                .then(response => {
                    content.innerHTML = `
                        <div class="emoji">🎉🍵</div>
                        <h1>เย้! ขอบคุณครับพี่เหนือ</h1>
                        <p>สถานะ: <b>สอบผ่าน (แบบหวุดหวิด)</b><br>เดี๋ยวผมซื้อขนมของโปรดพี่ไปง้อนะครับ รอรับได้เลย!</p>
                    `;
                })
                .catch(error => {
                    content.innerHTML = `
                        <div class="emoji">😅</div>
                        <h1>ระบบมีปัญหานิดหน่อย</h1>
                        <p>แต่ไม่เป็นไร ถือว่าพี่เหนือกดตกลงให้สิทธิ์จีบต่อแล้ว!<br>แคปหน้านี้มาทวงชาเขียวกับช็อกโกแลตได้เลยครับ!</p>
                    `;
                });
        }
    </script>
</body>
</html>
